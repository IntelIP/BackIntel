<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="960" viewBox="0 0 1600 960" role="img" aria-labelledby="title desc">
  <title id="title">BackIntel decision workspace concept</title>
  <desc id="desc">A visual mockup showing an issue queue, one case with facts and an experimental prediction, source evidence, and human decision controls.</desc>
  <defs>
    <style>
      svg { fill: #193045; }
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .muted { fill: #6f8190; }
      .small { font-size: 14px; }
      .tiny { font-size: 12px; }
      .label { font-size: 12px; font-weight: 700; letter-spacing: 1.4px; }
      .body { font-size: 16px; }
      .heading { font-size: 21px; font-weight: 700; }
      .card { fill: #fff; stroke: #e2e8ec; stroke-width: 1.5; }
      .rule { stroke: #e7edf0; stroke-width: 1.5; }
    </style>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#1d3a4b" flood-opacity="0.07"/>
    </filter>
  </defs>

  <rect width="1600" height="960" fill="#f4f7f8"/>
  <rect width="246" height="960" fill="#142d3c"/>
  <rect x="28" y="28" width="38" height="38" rx="11" fill="#54d2b5"/>
  <path d="M39 49l7-9 6 7 6-9" fill="none" stroke="#143a42" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="78" y="54" fill="#ffffff" font-size="22" font-weight="750">BackIntel</text>
  <text x="29" y="112" fill="#87a2af" class="label">WORKSPACES</text>
  <rect x="15" y="131" width="216" height="49" rx="10" fill="#294957"/>
  <rect x="15" y="140" width="4" height="31" rx="2" fill="#54d2b5"/>
  <text x="42" y="162" fill="#ffffff" class="body" font-weight="650">Issue review</text>
  <text x="42" y="217" fill="#b8cbd3" class="body">Equipment watch</text>
  <rect x="15" y="238" width="216" height="42" rx="9" fill="#1e3a49"/>
  <text x="42" y="265" fill="#9fb6c0" class="small">Demo layout preview</text>
  <text x="29" y="337" fill="#87a2af" class="label">RECORDS</text>
  <text x="42" y="382" fill="#b8cbd3" class="body">Decisions</text>
  <text x="42" y="428" fill="#b8cbd3" class="body">Reports</text>
  <line x1="26" y1="873" x2="219" y2="873" stroke="#45606d"/>
  <text x="28" y="906" fill="#aac1cb" class="small">Concept mockup · Not live</text>

  <text x="282" y="57" font-size="27" font-weight="750">Issue review</text>
  <text x="282" y="85" class="small muted">See what needs attention. Check the evidence. Record a decision.</text>
  <rect x="1378" y="31" width="179" height="42" rx="21" fill="#e4f2ef"/>
  <circle cx="1400" cy="52" r="5" fill="#28a987"/>
  <text x="1413" y="57" class="small" fill="#176e5c">Public issue demo</text>

  <rect x="282" y="119" width="1276" height="84" rx="15" fill="#e9f3f2" stroke="#d5e9e6"/>
  <text x="308" y="148" class="label" fill="#317d72">TODAY'S REVIEW</text>
  <text x="308" y="178" font-size="21" font-weight="700">3 cases need a human decision</text>
  <line x1="725" y1="137" x2="725" y2="184" stroke="#cbdedb"/>
  <text x="752" y="151" class="small muted">7 cases checked</text>
  <text x="752" y="179" font-size="18" font-weight="650">Original sources available</text>
  <line x1="1098" y1="137" x2="1098" y2="184" stroke="#cbdedb"/>
  <text x="1124" y="151" class="small muted">Prediction status</text>
  <text x="1124" y="179" font-size="18" font-weight="650">Experimental only</text>

  <rect x="282" y="224" width="314" height="688" rx="15" class="card" filter="url(#shadow)"/>
  <text x="306" y="259" class="heading">Cases</text>
  <text x="537" y="258" class="small muted">3 open</text>
  <rect x="306" y="278" width="266" height="40" rx="9" fill="#f5f8f9" stroke="#dfe8eb"/>
  <text x="322" y="304" class="small muted">⌕  Search issues</text>
  <text x="307" y="349" class="label muted">NEEDS DECISION</text>

  <rect x="297" y="365" width="284" height="119" rx="10" fill="#eaf4f2" stroke="#b9dcd4"/>
  <circle cx="317" cy="391" r="5" fill="#e68b40"/>
  <text x="331" y="396" class="small" font-weight="700">Issue #284</text>
  <text x="315" y="423" class="body" font-weight="650">Payment failure reported</text>
  <text x="315" y="451" class="small muted">Open 12 days · Review needed</text>
  <line x1="306" y1="506" x2="572" y2="506" class="rule"/>
  <text x="307" y="536" class="small" font-weight="700">Issue #291</text>
  <text x="307" y="561" class="small muted">Checkout error · Open 9 days</text>
  <line x1="306" y1="582" x2="572" y2="582" class="rule"/>
  <text x="307" y="612" class="small" font-weight="700">Issue #305</text>
  <text x="307" y="637" class="small muted">Refund request · Open 6 days</text>
  <line x1="306" y1="660" x2="572" y2="660" class="rule"/>
  <text x="307" y="697" class="label muted">REVIEWED</text>
  <text x="307" y="732" class="small muted">4 cases have saved decisions</text>
  <rect x="306" y="846" width="266" height="42" rx="9" fill="#f5f8f9"/>
  <text x="323" y="873" class="small" fill="#3e6f73">View weekly summary →</text>

  <rect x="614" y="224" width="630" height="688" rx="15" class="card" filter="url(#shadow)"/>
  <text x="640" y="259" class="small muted">ISSUE #284  /  DECISION RECORD</text>
  <text x="640" y="296" font-size="25" font-weight="750">Payment failure reported</text>
  <rect x="1049" y="269" width="164" height="31" rx="16" fill="#fff1e6"/>
  <text x="1064" y="290" class="small" fill="#aa5724">Needs review</text>
  <text x="640" y="325" class="small muted">Opened 12 days ago · Original public issue</text>
  <line x1="640" y1="345" x2="1218" y2="345" class="rule"/>

  <text x="640" y="378" class="label" fill="#467b77">OBSERVED FACTS</text>
  <text x="640" y="408" class="body">The opening report describes a payment failure.</text>
  <text x="640" y="433" class="body">No resolution appears in the collected record.</text>
  <text x="640" y="465" class="small muted">Facts come from the source snapshot, not the model.</text>
  <line x1="640" y1="490" x2="1218" y2="490" class="rule"/>

  <text x="640" y="522" class="label" fill="#467b77">BACKINTEL FINDING</text>
  <text x="640" y="552" class="body">This unresolved payment problem merits a billing review.</text>
  <text x="640" y="579" class="small muted">Interpretation · Reviewer should check before acting.</text>
  <rect x="640" y="600" width="578" height="70" rx="10" fill="#fff8ee" stroke="#f2dfc7"/>
  <text x="657" y="625" class="small" font-weight="700" fill="#9b6128">PREDICTION · EXPERIMENTAL</text>
  <text x="657" y="651" class="small" fill="#815d37">Current models did not beat the simple baseline.</text>

  <line x1="640" y1="694" x2="1218" y2="694" class="rule"/>
  <text x="640" y="728" class="label" fill="#467b77">YOUR DECISION</text>
  <rect x="640" y="744" width="133" height="39" rx="8" fill="#1d7769"/>
  <text x="656" y="769" class="small" fill="#ffffff" font-weight="650">Follow up</text>
  <rect x="783" y="744" width="123" height="39" rx="8" fill="#f4f7f8" stroke="#d9e3e6"/>
  <text x="801" y="769" class="small">No action</text>
  <rect x="916" y="744" width="171" height="39" rx="8" fill="#f4f7f8" stroke="#d9e3e6"/>
  <text x="933" y="769" class="small">Need more info</text>
  <rect x="640" y="798" width="578" height="55" rx="8" fill="#fbfcfc" stroke="#d9e3e6"/>
  <text x="655" y="830" class="small muted">Reason and next step…</text>
  <text x="640" y="885" class="small muted">Later outcome stays hidden until the first decision is recorded.</text>

  <rect x="1262" y="224" width="296" height="688" rx="15" class="card" filter="url(#shadow)"/>
  <text x="1286" y="259" class="heading">Evidence</text>
  <text x="1286" y="287" class="small muted">Check before deciding</text>
  <line x1="1286" y1="307" x2="1534" y2="307" class="rule"/>
  <text x="1286" y="339" class="label" fill="#467b77">ORIGINAL SOURCE</text>
  <text x="1286" y="370" class="body" font-weight="650">Public issue #284</text>
  <text x="1286" y="398" class="small" fill="#1d7769">Open source record ↗</text>
  <text x="1286" y="428" class="small muted">Snapshot: Jan 8, 10:32 AM</text>
  <line x1="1286" y1="455" x2="1534" y2="455" class="rule"/>
  <text x="1286" y="489" class="label" fill="#467b77">SOURCE EXCERPT</text>
  <text x="1286" y="522" class="small">“Payment failed at checkout.</text>
  <text x="1286" y="547" class="small">The customer cannot complete</text>
  <text x="1286" y="572" class="small">the order…”</text>
  <text x="1286" y="608" class="tiny muted">Illustrative wording for mockup.</text>
  <line x1="1286" y1="637" x2="1534" y2="637" class="rule"/>
  <text x="1286" y="671" class="label" fill="#467b77">TRACE</text>
  <text x="1286" y="703" class="small">Source → facts → finding</text>
  <text x="1286" y="729" class="small">→ review → later outcome</text>
  <rect x="1286" y="838" width="248" height="47" rx="9" fill="#f0f5f5"/>
  <text x="1302" y="867" class="small" fill="#3e6f73">View processing history →</text>
</svg>
