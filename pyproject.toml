[project]
name = "backintel"
version = "0.0.1"
description = "BackIntel: an experimental data-analyst agent on Deep Agents, benchmarked across storage types"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.14"
dependencies = [
  "deepagents==0.7.35",
  "langchain>=1.4,<2",
  "langchain-openai>=1.7,<2",
  "langsmith>=0.14.17,<0.15",
  "pydantic>=2,<3",
  "polars>=2.1,<3",
  "openpyxl>=3.1,<4",
  "httpx>=0.28,<1",
  "pyjwt>=2.9,<3",
  "duckdb>=2.0.0",
  "psycopg[binary]>=3.3.8",
  "pymongo>=4.13,<5",
  "pyiceberg[pyarrow,sql-sqlite]>=0.10,<0.11",
  "boto3>=1.40,<2",
]

[project.scripts]
backintel = "backintel.cli:main"

[dependency-groups]
dev = [
  "pytest>=8,<10",
  "ruff>=0.14,<1",
  "vulture==2.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/backintel"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: calls a model provider or a running store; skipped unless BACKINTEL_LIVE=1"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# Scenario questions and judge rubric text are prose; keep each on one line for diffs.
"src/backintel/bench/oracle/*.py" = ["E501"]
"src/backintel/bench/judge.py" = ["E501"]
"tests/*.py" = ["E501"]

[tool.vulture]
# Callback parameter names are fixed by LangChain/LangSmith public protocols.
ignore_names = ["run_manager", "reference_outputs"]
