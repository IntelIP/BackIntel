version: 2
updates:
  - package-ecosystem: pip
    directories:
      - /
      - /reflex_demo
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directories:
      - /apps/web
      - /frontend
      - /reflex_demo/reflex.lock
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
