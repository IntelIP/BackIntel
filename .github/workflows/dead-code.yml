name: Dead code

on:
  pull_request:
  push:
    branches: [main]

jobs:
  vulture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install vulture==2.16
      - run: vulture runtime scripts tests --min-confidence 90
