name: Decision workspace checks

on:
  pull_request:
    paths:
      - 'frontend/**'
      - 'reflex_demo/**'
      - 'runtime/decision_workspace.py'
      - 'tests/**'
      - 'scripts/validation/check_units.py'
      - 'scripts/sync_workspace_styles.py'
      - '.github/workflows/decision-workspace.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: mirror.gcr.io/library/postgres:18@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_backintel_workspace
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d test_backintel_workspace"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      BACKINTEL_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_backintel_workspace
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.testing.txt -r reflex_demo/requirements.txt
      - run: npm ci
        working-directory: frontend
      - run: mkdir -p artifacts/validation/DecisionWorkspace
      - run: npm run build
        working-directory: frontend
      - run: npm test -- --reporter=json --outputFile=../artifacts/validation/DecisionWorkspace/frontend-unit.json
        working-directory: frontend
      - run: npm run code:quality > ../artifacts/validation/DecisionWorkspace/fallow.log
        working-directory: frontend
      - run: python scripts/validation/check_units.py
      - run: python scripts/sync_workspace_styles.py
      - run: reflex export --no-zip
        working-directory: reflex_demo
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: decision-workspace-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/validation/DecisionWorkspace/
          if-no-files-found: error
