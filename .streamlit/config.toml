[server]
address = "127.0.0.1"
headless = true
fileWatcherType = "none"

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
showErrorDetails = false

[theme]
base = "light"
primaryColor = "#176581"
backgroundColor = "#FAF9F6"
secondaryBackgroundColor = "#F0EEE8"
textColor = "#203646"
font = "sans-serif"
headingFont = "serif"
baseFontSize = 17
baseRadius = "small"
borderColor = "#D9D6CD"
showWidgetBorder = true
